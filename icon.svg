<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Eve McGivern icon: a vinyl record whose outer groove is an open loop, with a gold dot at the gap and a coffee drop at the center">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a6b84"/>
      <stop offset="1" stop-color="#0f2a36"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#shine)"/>
  <g fill="none" stroke-linecap="round">
    <!-- lifecycle loop: open at the top, the gap is the control gate -->
    <path d="M148 40 A88 88 0 1 1 108 40" stroke="#9fd4e8" stroke-width="10"/>
    <!-- record grooves -->
    <circle cx="128" cy="128" r="64" stroke="#7fc2dd" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="128" cy="128" r="52" stroke="#7fc2dd" stroke-opacity="0.4" stroke-width="3"/>
    <circle cx="128" cy="128" r="40" stroke="#7fc2dd" stroke-opacity="0.3" stroke-width="3"/>
  </g>
  <!-- human in the loop: gold dot sits in the gate -->
  <circle cx="128" cy="40" r="13" fill="#f2b84b"/>
  <circle cx="128" cy="40" r="13" fill="none" stroke="#0f2a36" stroke-width="4" stroke-opacity="0.35"/>
  <!-- center label with a coffee drop -->
  <circle cx="128" cy="128" r="28" fill="#f6f7f9"/>
  <path d="M128 112 C136 124 140 130 140 136 A12 12 0 0 1 116 136 C116 130 120 124 128 112 Z" fill="#1f4c5e"/>
</svg>
